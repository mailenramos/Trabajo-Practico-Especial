# Observabilidad de TicketYa: Alloy junta los logs de los contenedores del proyecto
# "ticketya", los envía a Loki y Grafana los muestra.
# Se incluye desde el docker-compose.yml de la raíz; no hace falta levantarlo aparte.
#   Grafana: http://localhost:3000  (dashboard "TicketYa - Logs")
#   Alloy (diagnóstico del pipeline): http://localhost:12345
services:
  loki:
    image: grafana/loki:3.3.2
    container_name: ticketya-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: ticketya-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Solo lectura: Alloy descubre los contenedores y lee sus logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ticketya-grafana
    environment:
      # Solo para desarrollo local: acceso sin login (el puerto queda ligado a 127.0.0.1).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  loki-data:
  grafana-data:
