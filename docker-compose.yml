# Compose general de TicketYa.
# Requisitos (una sola vez):
#   docker network create ticketya-net
#   copy .env.example .env      (y completar los valores)
# Levantar:            docker compose up -d --build
# Probar desde cero:   docker compose down -v  &&  docker compose up -d --build
# Ver estado:          docker compose ps
#
# Cada servicio mantiene su propio compose (base sin puertos). Acá solo se incluyen
# y se agregan los servicios compartidos: Gateway y Mailpit (SMTP de prueba).
name: ticketya

include:
  - Backend/mcsv-lugares-sectores-eventos/docker-compose.yml        # MS1 lugares:8081
  - Backend/mcsv-disponibildad-reservas/docker-compose.yml          # MS2 reservas:8080
  - Backend/mcsv-compras-devoluciones/docker-compose.yml            # MS3 compras:8083
  - Backend/mcvs-pagos/docker-compose.yml                           # MS4 pagos:8084
  - Backend/msvc-entradas/docker-compose.yml                        # MS5 entradas:8085
  - Backend/mcsv-usuarios-autenticacion/docker-compose.yml          # MS6 usuarios:8087
  - Backend/mcsv-fila-virtual/docker-compose.yml                    # MS7 fila-virtual:8088
  - Backend/mcsv-preferencias-recomendaciones/docker-compose.yml    # MS8 preferencias:8089
  - Backend/mcsv-notificaciones/docker-compose.yml                  # MS9 notificaciones:8090
  - observabilidad/docker-compose.yml                               # Loki + Alloy+ Grafana (http://localhost:3000)

services:
  gateway:
    # Variables según Backend/APIGateWay/src/main/resources/application.yml (puerto 8086 por defecto).
    # Hoy el Gateway no enruta a MS8: cuando agregue esas rutas, sumar MS8_URL.
    build: ./Backend/APIGateWay
    container_name: ticketya-gateway
    environment:
      MS1_URL: http://lugares:8081
      MS2_URL: http://reservas:8080
      MS3_URL: http://compras:8083
      MS5_URL: http://entradas:8085
      MS6_URL: http://usuarios:8087
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      # Emisor (iss) de los JWT: debe coincidir con el JWT_ISSUER de Usuarios.
      JWT_ISSUER: "${JWT_ISSUER:-ticketya-usuarios}"
      GATEWAY_CORS_ALLOWED_ORIGINS: "${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
    ports:
      - "8086:8086"
    networks: [ticketya-net]

  mailpit:
    # SMTP de prueba para Notificaciones (SMTP_HOST=mailpit, SMTP_PORT=1025).
    # Bandeja web: http://localhost:8025
    image: axllent/mailpit:latest
    container_name: ticketya-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks: [ticketya-net]

networks:
  ticketya-net:
    external: true
    name: ticketya-net
