server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ticketya-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          # CORS lo resuelve el Gateway: si un servicio también agrega estos headers, se deja uno solo.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: ms1-lugares-lista
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/lugares
                - Method=GET,POST
            - id: ms1-lugar-detalle
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/lugares/{id}
                - Method=GET
            - id: ms1-lugar-sectores
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/lugares/{id}/sectores
                - Method=GET,POST
            - id: ms1-eventos-lista
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos
                - Method=GET,POST
            - id: ms1-evento-detalle
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}
                - Method=GET,PUT
            - id: ms1-evento-personal-acceso
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/personal-acceso
                - Method=GET,POST
            - id: ms1-evento-personal-acceso-revocar
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/personal-acceso/{usuarioId}
                - Method=DELETE
            - id: ms1-evento-precio-sector
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/sectores/{sectorId}/precio
                - Method=PUT
            - id: ms1-evento-limite-cliente
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/limite-entradas-por-cliente
                - Method=PUT
            - id: ms1-evento-publicar
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/publicar
                - Method=PUT
            - id: ms1-evento-suspender
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/venta/suspender
                - Method=PUT
            - id: ms1-evento-reactivar
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/venta/reactivar
                - Method=PUT
            - id: ms1-evento-cancelar
              uri: ${gateway.services.ms1-url:${MS1_URL:http://localhost:8081}}
              predicates:
                - Path=/eventos/{eventoId}/cancelar
                - Method=PUT
            - id: ms2-crear-reserva
              uri: ${gateway.services.ms2-url:${MS2_URL:http://localhost:8080}}
              predicates:
                - Path=/disponibilidad/eventos/{eventoId}/reservas
                - Method=POST
            - id: ms3-compras-lista
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/compras
                - Method=GET,POST
            - id: ms3-compra-detalle
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/compras/{compraId}
                - Method=GET
            - id: ms3-compra-pago
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/compras/{compraId}/pago
                - Method=POST
            - id: ms3-devoluciones-lista
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/devoluciones
                - Method=GET,POST
            - id: ms3-devolucion-detalle
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/devoluciones/{devolucionId}
                - Method=GET
            - id: ms3-devolucion-aprobar
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/devoluciones/{devolucionId}/aprobacion
                - Method=POST
            - id: ms3-devolucion-rechazar
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/devoluciones/{devolucionId}/rechazo
                - Method=POST
            - id: ms3-reintegros-lista
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/reintegros
                - Method=GET
            - id: ms3-reintegro-reintentar
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/reintegros/{reintegroId}/reintento
                - Method=POST
            - id: ms3-reportes
              uri: ${gateway.services.ms3-url:${MS3_URL:http://localhost:8083}}
              predicates:
                - Path=/reportes/eventos/{eventoId}/{reporte}
                - Method=GET
            - id: ms6-auth
              uri: ${gateway.services.ms6-url:${MS6_URL:http://localhost:8087}}
              predicates:
                - Path=/auth/registro,/auth/login
                - Method=POST
            - id: ms6-usuario-me
              uri: ${gateway.services.ms6-url:${MS6_URL:http://localhost:8087}}
              predicates:
                - Path=/usuarios/me
                - Method=GET,PUT
            - id: ms6-usuarios-lista
              uri: ${gateway.services.ms6-url:${MS6_URL:http://localhost:8087}}
              predicates:
                - Path=/usuarios
                - Method=GET
            - id: ms6-usuario-detalle
              uri: ${gateway.services.ms6-url:${MS6_URL:http://localhost:8087}}
              predicates:
                - Path=/usuarios/{usuarioId}
                - Method=GET
            - id: ms6-usuario-roles-estado
              uri: ${gateway.services.ms6-url:${MS6_URL:http://localhost:8087}}
              predicates:
                - Path=/usuarios/{usuarioId}/roles,/usuarios/{usuarioId}/estado
                - Method=PUT
            - id: ms7-ingreso
              uri: ${gateway.services.ms7-url:${MS7_URL:http://localhost:8088}}
              predicates:
                - Path=/filas/eventos/{eventoId}/ingresos
                - Method=POST
            - id: ms7-mi-turno
              uri: ${gateway.services.ms7-url:${MS7_URL:http://localhost:8088}}
              predicates:
                - Path=/filas/eventos/{eventoId}/mi-turno
                - Method=GET
            - id: ms7-consultar-fila
              uri: ${gateway.services.ms7-url:${MS7_URL:http://localhost:8088}}
              predicates:
                - Path=/filas/eventos/{eventoId}
                - Method=GET
            - id: ms7-configuracion-estado
              uri: ${gateway.services.ms7-url:${MS7_URL:http://localhost:8088}}
              predicates:
                - Path=/filas/eventos/{eventoId}/configuracion,/filas/eventos/{eventoId}/estado
                - Method=PUT
            - id: ms8-preferencias
              uri: ${gateway.services.ms8-url:${MS8_URL:http://localhost:8089}}
              predicates:
                - Path=/preferencias/me
                - Method=GET,PUT,DELETE
            - id: ms8-recomendaciones
              uri: ${gateway.services.ms8-url:${MS8_URL:http://localhost:8089}}
              predicates:
                - Path=/recomendaciones/me
                - Method=GET
            - id: ms5-validar-ingreso
              uri: ${gateway.services.ms5-url:${MS5_URL:http://localhost:8085}}
              predicates:
                - Path=/eventos/{eventoId}/ingresos
                - Method=POST
            - id: ms5-entradas-lista
              uri: ${gateway.services.ms5-url:${MS5_URL:http://localhost:8085}}
              predicates:
                - Path=/entradas
                - Method=GET
            - id: ms5-entrada-detalle
              uri: ${gateway.services.ms5-url:${MS5_URL:http://localhost:8085}}
              predicates:
                - Path=/entradas/{id}
                - Method=GET

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    # Emisor (iss) de los JWT: debe coincidir con JWT_ISSUER de MS6.
    jwt-issuer: ${JWT_ISSUER:ticketya-usuarios}
