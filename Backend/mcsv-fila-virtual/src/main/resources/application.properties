spring.application.name=ms-fila-virtual
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]
logging.level.org.springframework.web.client.DefaultRestClient=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
server.port=${SERVER_PORT:8088}

spring.datasource.url=${MS7_DB_URL:jdbc:mysql://localhost:3307/fila_virtual}
spring.datasource.username=${MS7_DB_USERNAME:root}
spring.datasource.password=${MS7_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=false

ms7.turnos.fixed-delay-ms=${MS7_TURNOS_FIXED_DELAY_MS:60000}
ms1.api.base-url=${MS1_API_BASE_URL:http://localhost:8081}
ms1.api.connect-timeout-ms=${MS1_API_CONNECT_TIMEOUT_MS:2000}
ms1.api.read-timeout-ms=${MS1_API_READ_TIMEOUT_MS:5000}
spring.jackson.deserialization.fail-on-unknown-properties=true

# Solo salud está disponible por HTTP para monitoreo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
