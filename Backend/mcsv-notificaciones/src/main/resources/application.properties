spring.application.name=notificaciones
# Puerto a confirmar por el grupo
server.port=${PUERTO:8090}

# Base de datos propia (motor a confirmar por el grupo; se asume MySQL, igual que Compras)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_notificaciones?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# SMTP (servidor a definir por el grupo; en desarrollo, un servidor de pruebas como MailHog/Mailpit)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_TIMEOUT_CONEXION_MS:2000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_LECTURA_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT_LECTURA_MS:5000}
notificaciones.correo.remitente=${SMTP_REMITENTE:no-responder@ticketya.local}

# Gestión de usuarios y autenticación (MS6), llamada directa sin pasar por el Gateway (8086).
# Puerto 8087 previsto, a confirmar por el grupo. GET /internal/usuarios/{id}/contacto
notificaciones.usuarios.url=${USUARIOS_URL:http://localhost:8087}
notificaciones.usuarios.timeout-conexion=${USUARIOS_TIMEOUT_CONEXION:2s}
notificaciones.usuarios.timeout-lectura=${USUARIOS_TIMEOUT_LECTURA:5s}

# Reintentos: espera creciente (base * 2^(intentos-1)) con tope, hasta el máximo de intentos
notificaciones.reintentos.maximo-intentos=${NOTIF_MAX_INTENTOS:5}
notificaciones.reintentos.espera-base=${NOTIF_ESPERA_BASE:30s}
notificaciones.reintentos.espera-maxima=${NOTIF_ESPERA_MAXIMA:1h}

# Tarea de envío
notificaciones.envio.activo=${NOTIF_ENVIO_ACTIVO:true}
notificaciones.envio.intervalo=${NOTIF_ENVIO_INTERVALO:10s}
notificaciones.envio.tamanio-lote=${NOTIF_ENVIO_LOTE:20}
# Si el servicio se cae con una notificación en PROCESANDO, pasado este plazo se recupera
notificaciones.envio.plazo-procesamiento=${NOTIF_PLAZO_PROCESAMIENTO:2m}
notificaciones.envio.intervalo-recuperacion=${NOTIF_INTERVALO_RECUPERACION:60s}

# Autorización entre servicios (provisoria, a acordar con el grupo): los servicios llaman a
# /internal/** con el encabezado X-Service-Token. Sin token configurado se rechaza todo con 403.
notificaciones.seguridad.token-servicio=${SERVICIO_TOKEN:}

# Monitoreo: por HTTP solo se expone /actuator/health (healthcheck de Docker), sin detalles.
# No pasa por el filtro de X-Service-Token (solo /internal/**).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El SMTP no forma parte de la salud: si no responde, los correos se reintentan y el servicio sigue
# recibiendo avisos; marcarlo DOWN haría que Docker lo considere caído.
management.health.mail.enabled=false

# Logs: solo por consola (stdout, sin archivo), con el id de correlación que guarda CorrelacionFilter
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [%thread] [correlationId=%X{correlacionId:-}] %logger{36} : %m%n%wEx
