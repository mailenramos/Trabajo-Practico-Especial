# Base en memoria (H2 en modo MySQL) para los tests: no hace falta un MySQL levantado
spring.datasource.url=jdbc:h2:mem:notificaciones;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# En los tests las tareas programadas se disparan a mano
notificaciones.envio.activo=false
notificaciones.seguridad.token-servicio=token-de-prueba
