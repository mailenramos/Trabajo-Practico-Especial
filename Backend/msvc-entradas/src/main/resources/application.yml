server:
  port: 8085

spring:
  application:
    name: msvc-entradas
  datasource:
    url: jdbc:postgresql://localhost:5433/entradas
    username: entradas
    password: entradas
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

entradas:
  seguridad:
    # Secreto compartido para X-Service-Token en /internal/**. Vacío = validación desactivada.
    service-token: ${SERVICE_TOKEN:}
  ms1:
    # Lugares, sectores y eventos: autorización del personal de acceso.
    url: ${MS1_URL:http://localhost:8081}
    connect-timeout: ${MS1_CONNECT_TIMEOUT:1s}
    read-timeout: ${MS1_READ_TIMEOUT:2s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html