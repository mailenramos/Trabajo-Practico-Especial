server:
  port: 8085

spring:
  application:
    name: msvc-entradas
  datasource:
    url: jdbc:postgresql://localhost:5433/entradas
    username: entradas
    password: entradas
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html