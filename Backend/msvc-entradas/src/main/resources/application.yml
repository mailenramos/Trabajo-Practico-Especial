server:
  port: 8085

spring:
  application:
    name: msvc-entradas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/entradas}
    username: ${DB_USER:entradas}
    password: ${DB_PASSWORD:entradas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

entradas:
  seguridad:
    # Token compartido entre servicios (X-Service-Token) para /internal/**. Vacío = validación
    # desactivada (solo desarrollo local; en Docker es obligatorio).
    service-token: ${SERVICIO_TOKEN:}
  ms1:
    # Lugares, sectores y eventos: autorización del personal de acceso.
    url: ${EVENTOS_URL:http://localhost:8081}
    connect-timeout: ${EVENTOS_CONNECT_TIMEOUT:1s}
    read-timeout: ${EVENTOS_READ_TIMEOUT:2s}

# Monitoreo: por HTTP solo se expone /actuator/health (healthcheck de Docker), sin detalles.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Logs a la consola (stdout) con el identificador de correlación de cada pedido.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [%thread] [correlationId=%X{correlationId:-}] %logger{36} : %m%n%wEx"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html