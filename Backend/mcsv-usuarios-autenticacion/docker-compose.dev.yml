# Solo desarrollo, junto con docker-compose.yml. Publica la app (8087) y la base (5436) en loopback;
# la base publicada permite ejecutar el servicio desde el IDE con los valores por defecto.
services:
  usuarios:
    ports:
      - "127.0.0.1:8087:8087"
  postgres-usuarios:
    ports:
      - "127.0.0.1:5436:5432"
