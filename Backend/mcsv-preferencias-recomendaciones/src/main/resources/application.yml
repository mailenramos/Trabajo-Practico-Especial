spring:
  application:
    name: preferencias
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/ticketya_preferencias}
      auto-index-creation: true

server:
  port: ${PORT:8089}

integraciones:
  eventos:
    base-url: ${EVENTOS_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
  compras:
    base-url: ${COMPRAS_BASE_URL:http://localhost:8083}
    servicio-token: ${SERVICIO_TOKEN:}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoint:
    health:
      show-details: never
