spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  profiles:
    default: dev
  application:
    name: gestion-lugares
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticketya_lugares?directConnection=true}
      auto-index-creation: true

server:
  port: ${PORT:8081}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

management:
  endpoint:
    health:
      show-details: never

reservas:
  base-url: ${RESERVAS_BASE_URL:http://localhost:8080}
  connect-timeout: ${RESERVAS_CONNECT_TIMEOUT:2s}
  read-timeout: ${RESERVAS_READ_TIMEOUT:5s}

compras:
  base-url: ${COMPRAS_BASE_URL:http://localhost:8083}

usuarios:
  base-url: ${USUARIOS_BASE_URL:http://localhost:8087}

servicio:
  token: ${SERVICIO_TOKEN:}

preferencias:
  base-url: ${PREFERENCIAS_BASE_URL:http://localhost:8089}

catalogo:
  cache:
    ttl: ${CATALOGO_CACHE_TTL:30s}
    maximo-entradas: ${CATALOGO_CACHE_MAXIMO_ENTRADAS:1000}

eventos:
  finalizacion:
    interval: ${EVENTOS_FINALIZACION_INTERVAL:60s}

outbox:
  dispatcher:
    interval: ${OUTBOX_DISPATCHER_INTERVAL:60s}
