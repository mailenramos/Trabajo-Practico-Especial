spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  profiles:
    default: dev
  application:
    name: gestion-lugares
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticketya_lugares?directConnection=true}
      auto-index-creation: true

server:
  port: ${PORT:8081}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: never
      show-components: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        slow-call-duration-threshold: 365d
        register-health-indicator: true
        allow-health-indicator-to-fail: false
    instances:
      reservas:
        base-config: default
        ignore-exception-predicate: com.ticketya.gestionlugares.reservas.Respuesta4xxReservasPredicate
      usuarios:
        base-config: default
        ignore-exception-predicate: com.ticketya.gestionlugares.usuarios.ErroresIgnoradosUsuariosPredicate

reservas:
  base-url: ${RESERVAS_BASE_URL:http://localhost:8080}
  connect-timeout: ${RESERVAS_CONNECT_TIMEOUT:2s}
  read-timeout: ${RESERVAS_READ_TIMEOUT:5s}

compras:
  base-url: ${COMPRAS_BASE_URL:http://localhost:8083}

filas:
  base-url: ${FILAS_BASE_URL:http://localhost:8088}

usuarios:
  base-url: ${USUARIOS_BASE_URL:http://localhost:8087}

servicio:
  token: ${SERVICIO_TOKEN:}

preferencias:
  base-url: ${PREFERENCIAS_BASE_URL:http://localhost:8089}

catalogo:
  cache:
    ttl: ${CATALOGO_CACHE_TTL:30s}
    maximo-entradas: ${CATALOGO_CACHE_MAXIMO_ENTRADAS:1000}

eventos:
  finalizacion:
    interval: ${EVENTOS_FINALIZACION_INTERVAL:60s}

outbox:
  dispatcher:
    interval: ${OUTBOX_DISPATCHER_INTERVAL:60s}
