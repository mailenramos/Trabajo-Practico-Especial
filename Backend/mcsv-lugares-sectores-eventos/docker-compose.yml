services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ticketya_lugares
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }; const status = rs.status(); if (status.ok !== 1 || status.members[0].stateStr !== 'PRIMARY') quit(1)"
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - ticketya-net

  lugares:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ticketya_lugares?replicaSet=rs0
      RESERVAS_BASE_URL: ${RESERVAS_BASE_URL:-http://reservas:8080}
      COMPRAS_BASE_URL: ${COMPRAS_BASE_URL:-http://compras:8083}
      PREFERENCIAS_BASE_URL: ${PREFERENCIAS_BASE_URL:-http://preferencias:8089}
      OUTBOX_DISPATCHER_INTERVAL: ${OUTBOX_DISPATCHER_INTERVAL:-60s}
      EVENTOS_FINALIZACION_INTERVAL: ${EVENTOS_FINALIZACION_INTERVAL:-60s}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      PORT: ${PORT:-8081}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://localhost:$${PORT:-8081}/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ticketya-net

volumes:
  mongodb_data:

networks:
  ticketya-net:
    external: true
    name: ticketya-net
