# MS4 Pagos (interno). Sin puertos publicados: para desarrollo local usar también
# docker-compose.dev.yml. Requiere la red externa: docker network create ticketya-net
services:
  pagos-db:
    image: postgres:16-alpine
    container_name: ticketya-pagos-db
    environment:
      POSTGRES_DB: "${DB_NAME:-ticketya_payments}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Configure DB_PASSWORD}"
    volumes:
      - pagos-db-data:/var/lib/postgresql/data
    networks: [ticketya-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  pagos:
    build: .
    container_name: ticketya-pagos
    environment:
      SERVER_PORT: "${SERVER_PORT:-8084}"
      DB_HOST: "${DB_HOST:-pagos-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-ticketya_payments}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:?Configure DB_PASSWORD}"
      PAGOS_DECISION_PAGO: "${PAGOS_DECISION_PAGO:-APPROVED}"
      PAGOS_DECISION_REINTEGRO: "${PAGOS_DECISION_REINTEGRO:-SUCCESS}"
      SERVICIO_TOKEN: "${SERVICIO_TOKEN:-}"
      PAGOS_EXIGIR_TOKEN_SERVICIO: "${PAGOS_EXIGIR_TOKEN_SERVICIO:-false}"
    depends_on:
      pagos-db:
        condition: service_healthy
    networks: [ticketya-net]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$$SERVER_PORT/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pagos-db-data:
    name: pagos-db-data

networks:
  ticketya-net:
    external: true
    name: ticketya-net
