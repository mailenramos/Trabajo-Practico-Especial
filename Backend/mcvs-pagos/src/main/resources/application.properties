spring.application.name=msvc-pagos
server.port=${SERVER_PORT:8084}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketya_payments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
ticketya.payment-simulation.payment-decision=${PAGOS_DECISION_PAGO:APPROVED}
ticketya.payment-simulation.refund-decision=${PAGOS_DECISION_REINTEGRO:SUCCESS}

# Token compartido entre servicios (header X-Service-Token) para /internal/**.
# Con exigir-token-servicio=false no se valida (Compras todavía no envía el header a Pagos).
pagos.seguridad.token-servicio=${SERVICIO_TOKEN:}
pagos.seguridad.exigir-token-servicio=${PAGOS_EXIGIR_TOKEN_SERVICIO:false}

# Actuator: solo /actuator/health (healthchecks y orden de arranque en Docker)
management.endpoints.web.exposure.include=health

# Logs a stdout con el X-Correlation-Id del pedido
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-sin-correlation-id}] [requestId=%X{requestId:-sin-request-id}] %logger{36} - %msg%n
