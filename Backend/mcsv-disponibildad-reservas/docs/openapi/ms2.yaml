  - Read-only inventory of each target schema before applying V4; incompatible legacy fila values require an explicitly approved remediation, because V4 aborts before DDL for non-numeric, out-of-range or colliding values.
  - Compatibility for retries against events with legacy unversioned initialization fingerprints; MS2 cannot confirm those retries as identical and currently returns a conflict.
