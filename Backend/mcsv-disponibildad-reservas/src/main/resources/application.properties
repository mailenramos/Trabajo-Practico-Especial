spring.application.name=ms-disponibilidad-reservas
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/disponibilidad_reservas
spring.datasource.username=root
spring.datasource.password=admin123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=false

ms2.reservas.expiracion.fixed-delay-ms=${MS2_RESERVAS_EXPIRACION_FIXED_DELAY_MS:60000}
ms1.api.base-url=${MS1_API_BASE_URL:http://localhost:8081}
ms2.outbox.fixed-delay-ms=${MS2_OUTBOX_FIXED_DELAY_MS:5000}
ms2.outbox.initial-backoff-ms=${MS2_OUTBOX_INITIAL_BACKOFF_MS:1000}
ms2.outbox.max-backoff-ms=${MS2_OUTBOX_MAX_BACKOFF_MS:300000}
ms2.outbox.lease-ms=${MS2_OUTBOX_LEASE_MS:15000}
ms2.outbox.connect-timeout-ms=${MS2_OUTBOX_CONNECT_TIMEOUT_MS:2000}
ms2.outbox.read-timeout-ms=${MS2_OUTBOX_READ_TIMEOUT_MS:5000}
ms2.outbox.max-batch=${MS2_OUTBOX_MAX_BATCH:50}

# Reject undeclared JSON fields at every nesting level.
spring.jackson.deserialization.fail-on-unknown-properties=true
