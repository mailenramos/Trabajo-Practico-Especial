          schema: { type: string, enum: [PENDIENTE, EXITOSO, FALLIDO] }
      responses:
        '200':
          description: Reintegros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reintegro' }
              example:
                - id: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7081
                  compraId: 3f2a9c1e-8b7d-4e6f-a1b2-c3d4e5f60718
                  refundRequestId: 8a1f2b3c-4d5e-4f60-9a1b-2c3d4e5f6071
                  monto: 15000.00
                  motivo: Devolución de entrada 5d0b8e2f-1a3c-4b6d-9e7f-0a1b2c3d4e5f
                  origen: DEVOLUCION
                  estado: FALLIDO
                  intentos: 1
                  pagosReintegroId: 9e8d7c6b-5a49-4382-a1b0-c9d8e7f6a5b4
                  ultimoError: Pagos no logró el reintegro
                  creadoEn: '2026-11-08T18:00:00Z'
                  actualizadoEn: '2026-11-08T18:00:01Z'
        '401':
          $ref: '#/components/responses/NoIdentificado'
        '403':
          $ref: '#/components/responses/SoloAdministrador'

  /reintegros/{reintegroId}/reintento:
    post:
      tags: [Reintegros]
      summary: Reintentar un reintegro sin duplicarlo (administrador)
      description: |
        - Exitoso: no se llama a Pagos.
        - Pendiente sin respuesta: se repite el pedido con el mismo `refundRequestId` y la
          misma `Idempotency-Key`; Pagos no lo duplica.
        - Fallido: `POST /internal/reintegros/{refundId}/reintentar` de Pagos sobre el mismo reintegro. Si
          responde 409, se consulta el estado del reintegro en Pagos.

        Si el reintegro es de una devolución, se retoma la devolución completa desde el
        paso que falló (y, con el reintegro exitoso, la entrada pasa a devuelta).

        Si es de un evento cancelado (`origen: CANCELACION_EVENTO`), con el reintegro
        exitoso pasan a devuelta las entradas que incluye y que todavía no lo estén.

        Si Entradas no responde o rechaza pasar una entrada a devuelta (conflicto de
        estado), el reintegro sigue exitoso, el motivo queda en `ultimoError` y responde 202.
      parameters:
        - name: reintegroId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRolesAdmin'
        - $ref: '#/components/parameters/XUserRole'
      responses:
        '200':
          description: >-
            Reintegro exitoso (y, si es de una devolución o de un evento cancelado, con sus
            entradas devueltas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reintegro' }
        '202':
          description: Sigue pendiente o fallido; ver ultimoError
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reintegro' }
              examples:
                fallido:
                  $ref: '#/components/examples/ReintegroFallido'
        '401':
          $ref: '#/components/responses/NoIdentificado'
        '403':
          $ref: '#/components/responses/SoloAdministrador'
        '404':
          description: El reintegro no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-11-08T18:00:00Z'
                status: 404
                error: REINTEGRO_NO_ENCONTRADO
                mensaje: No existe el reintegro 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7081

  /eventos-cancelados:
    post:
      tags: [Cancelación de eventos]
      summary: Aviso de cancelación de un evento (llamada interna de Eventos)
      security: []
      description: |
        E-1. Idempotente por `eventoId`: el mismo evento se procesa una sola vez. Responde
        enseguida y procesa en segundo plano:

        1. Pide a Entradas pasar a en reintegro las entradas del evento y registrar su cierre
           (`POST /internal/eventos/{idEvento}/entradas/reintegro`). La cantidad que responde
           (`entradasMarcadas`) es solo informativa; `cerrado: true` confirma el cierre. Sin
           esa confirmación (el campo no viene, viene en `false` o Entradas no responde), la
           cancelación no se da por completa: el error queda guardado y se reintenta al
           retomarla. Repetir la marcación es seguro.
        2. Por cada compra **confirmada** del evento: cierra como rechazadas sus solicitudes
           de devolución pendientes (motivo "Evento cancelado: reintegro automático") y pide
           **un** reintegro con `reason` "Evento cancelado" por el precio unitario de las
           entradas que siguen vigentes (las que tienen una devolución aprobada no se
           vuelven a reintegrar). Con el reintegro exitoso, esas entradas pasan a devuelta.
        3. Cada compra **pendiente** del evento se cierra como `FALLIDA`:
           - con un pago aprobado (registrado, o que Pagos informa en
             `GET /internal/pagos/compra/{purchaseId}` porque se perdió la respuesta del
             cobro): **un** reintegro por el total con `reason` "Evento cancelado" y
             `origen: CANCELACION_EVENTO`. Las entradas que llegaron a asociarse a la compra
             pasan a devuelta con el reintegro exitoso;
           - sin un pago aprobado: queda `FALLIDA` sin reintegro;
           - si Pagos no responde esa consulta, la compra sigue `PENDIENTE` y la cancelación
             queda en proceso y se retoma automáticamente pasado el plazo.

           Si un pago de esa compra se está retomando a la vez, gana quien cambia primero su
           estado: si el pago la confirma antes, se trata como confirmada (punto 2).
           Límite (Entrega 1): si la emisión se hizo en Entradas pero la respuesta no llegó,
           esas entradas quedan en reintegro y no pasan a devuelta, porque este servicio no
           conoce su ID.
        4. Las compras que ya estaban fallidas no generan reintegro.

        Un reintegro que falla queda registrado y se reintenta con
        `POST /reintegros/{reintegroId}/reintento`; no frena a las demás compras.

        Si la cancelación quedó en proceso más de `compras.cancelacion.plazo-en-proceso`
        (5 minutos por defecto; el servicio se cayó a mitad de camino o una compra falló), se
        retoma automáticamente, sin esperar otro aviso: el servicio revisa las cancelaciones
        en proceso cada `compras.cancelacion.intervalo-reanudacion` (60 s por defecto). La
        retoma no duplica reintegros ni vuelve a pedir a Entradas un cierre ya confirmado.
        Eventos no necesita reenviar el aviso después de recibir 202; si lo reenvía, la
        respuesta es la misma (202 mientras se procesa, 200 cuando terminó).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelacionEventoPedido' }
            example:
              eventoId: evento-1
              motivo: Suspendido por lluvia
              canceladoEn: '2026-11-08T12:00:00Z'
      responses:
        '202':
          description: Aviso nuevo aceptado, o la cancelación de ese evento todavía se está procesando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoCancelacion' }
              example:
                eventoId: evento-1
                resultado: ACEPTADO
        '200':
          description: La cancelación de ese evento ya se procesó; no se repite nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoCancelacion' }
              example:
                eventoId: evento-1
                resultado: YA_PROCESADO
        '400':
          description: Falta el `eventoId` o el cuerpo no es un JSON válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-11-08T18:00:00Z'
                status: 400
                error: VALIDACION
                mensaje: El pedido tiene datos inválidos
                campos:
                  eventoId: es obligatorio

  /internal/eventos/{eventoId}/co-compras:
    get:
      tags: [Recomendaciones (interno)]
      summary: Co-compras de un evento (llamada interna de Recomendaciones)
      description: |
        Otros eventos que compraron los clientes con una compra **confirmada** del evento
        indicado, con la cantidad de esos clientes que los compraron (cada cliente cuenta una
        vez aunque tenga varias compras). Ordenado de mayor a menor cantidad y, a igual
        cantidad, por `eventoId`. No incluye al evento consultado. Las compras pendientes o
        fallidas no cuentan.

        Si el evento no tiene compras confirmadas o ningún cliente compró otro evento,
        responde `200` con `coCompras: []` (no `404`).
      security:
        - TokenDeServicio: []
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: string }
          example: evento-1
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de eventos. 10 si no se indica; un valor mayor a 20 se trata como 20
          schema: { type: integer, minimum: 1, default: 10 }
          example: 5
      responses:
        '200':
          description: Co-compras del evento (puede ser una lista vacía)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoCompras' }
              examples:
                conResultados:
                  value:
                    eventoId: evento-1
                    coCompras:
                      - { eventoId: evento-7, cantidad: 12 }
                      - { eventoId: evento-3, cantidad: 4 }
                sinResultados:
                  value:
                    eventoId: evento-9
                    coCompras: []
        '400':
          description: El `limite` no es un entero mayor a 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-11-20T12:00:00Z'
                status: 400
                error: PARAMETRO_INVALIDO
                mensaje: El parámetro limite debe ser un entero mayor a 0
        '403': { $ref: '#/components/responses/ServicioNoAutorizado' }

  /internal/usuarios/{usuarioId}/historial-preferencias:
    get:
      tags: [Recomendaciones (interno)]
      summary: Historial de preferencias de un cliente (llamada interna de Recomendaciones)
      description: |
        A partir de las compras **confirmadas** del cliente:

        - `tipos`: los tipos de evento, sin repetir, con la cantidad de compras de cada uno,
          de mayor a menor (a igual cantidad, por tipo). El tipo se copia de Eventos al
          iniciar la compra; las compras anteriores a la Entrega 2 no tienen tipo y no
          cuentan acá.
        - `eventosComprados`: los `eventoId` distintos de esas compras, del comprado más
          recientemente al más antiguo, como máximo 20. Incluye las compras sin tipo.

        Las compras pendientes o fallidas no cuentan. Un cliente sin compras confirmadas
        recibe `200` con las dos listas vacías (no `404`).
      security:
        - TokenDeServicio: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string }
          example: cliente-1
      responses:
        '200':
          description: Historial del cliente (las listas pueden estar vacías)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialPreferencias' }
              examples:
                conCompras:
                  value:
                    usuarioId: cliente-1
                    tipos:
                      - { tipo: RECITAL, cantidad: 3 }
                      - { tipo: TEATRO, cantidad: 1 }
                    eventosComprados: [evento-7, evento-3, evento-1]
                sinCompras:
                  value:
                    usuarioId: cliente-2
                    tipos: []
                    eventosComprados: []
        '403': { $ref: '#/components/responses/ServicioNoAutorizado' }

  /internal/eventos-modificados:
    post:
      tags: [Modificación de eventos (interno)]
      summary: Aviso de modificación de un evento (llamada interna de Eventos)
      description: |
        Eventos avisa que un evento cambió de fecha, horario o lugar. Idempotente por
        `eventoId` + `version` (contador que Eventos incrementa en cada modificación). En una
        sola transacción:

        1. Registra la modificación.
        2. Si viene `fechaHora`, actualiza la fecha de inicio guardada en **todas** las compras
           y solicitudes de devolución del evento.
        3. Genera un aviso `EVENTO_MODIFICADO` a Notificaciones por cada cliente con una compra
           **confirmada** del evento (uno por cliente, aunque tenga varias compras), con
           `acontecimientoId` `evento-modificado-{eventoId}-v{version}`. Lleva `nuevaFecha`
           (dd/MM/yyyy) y `nuevoHorario` (HH:mm, en hora de Argentina) si vino `fechaHora`, y
           `nuevoLugar` (lugar y ciudad) si vino alguno de los dos.

        Si algo falla no queda nada guardado, y Eventos puede reintentar con la misma versión.
        Una versión ya procesada, o menor que la mayor ya procesada del evento, responde `200`
        sin cambiar nada. No genera reintegros ni cambia el estado de las entradas.
      security:
        - TokenDeServicio: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificacionEventoPedido' }
            examples:
              fechaYLugar:
                value:
                  eventoId: evento-1
                  version: 3
                  fechaHora: '2026-12-15T23:30:00Z'
                  lugar: Estadio Norte
                  ciudad: Rosario
              soloLugar:
                value:
                  eventoId: evento-1
                  version: 4
                  lugar: Teatro Sur
      responses:
        '202':
          description: Modificación nueva aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoModificacion' }
              example:
                eventoId: evento-1
                version: 3
                resultado: ACEPTADA
        '200':
          description: Esa versión ya se procesó, o es anterior a la mayor ya procesada; no se cambia nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoModificacion' }
              examples:
                yaProcesada:
                  value:
                    eventoId: evento-1
                    version: 3
                    resultado: YA_PROCESADA
                versionAnterior:
                  value:
                    eventoId: evento-1
                    version: 2
                    resultado: VERSION_ANTERIOR
        '400':
          description: |
            Falta `eventoId` o `version`, `version` es menor a 1, no viene ninguno de
            `fechaHora`, `lugar` o `ciudad`, o `fechaHora` no es una fecha ISO-8601 válida.
            No se guarda nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-11-20T12:00:00Z'
                status: 400
                error: VALIDACION
                mensaje: El pedido tiene datos inválidos
                campos:
                  fechaHora: debe venir al menos uno de fechaHora, lugar o ciudad
        '403': { $ref: '#/components/responses/ServicioNoAutorizado' }

  /reportes/eventos/{eventoId}/ventas:
    get:
      tags: [Reportes]
      summary: Reporte de ventas de un evento (organizador titular o administrador)
      description: |
        Solo compras CONFIRMADAS (con las entradas emitidas): cantidad de compras, entradas
        vendidas históricas e importe vendido con los precios guardados al momento de cada compra,
        en total y por sector. Las devoluciones no restan (ver el reporte de devoluciones). Las
        compras cobradas cuya emisión no terminó se informan aparte en `comprasConEmisionIncompleta`.
        Los sectores son los que informa Eventos (en su orden) más los que aparezcan en compras y
        Eventos ya no tenga. Se calcula al momento; no se guarda nada.
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRolesReportes'
      responses:
        '200':
          description: Reporte de ventas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteVentas' }
              example:
                eventoId: evento-1
                eventoNombre: Recital de prueba
                estadoEvento: publicado
                generadoEn: '2026-11-23T12:00:00Z'
                hayOperacionesPendientes: true
                totales: { comprasConfirmadas: 2, entradasVendidas: 8, importeVendido: 102002.00 }
                sectores:
                  - { sectorId: platea, sectorNombre: Platea, entradasVendidas: 4, importeVendido: 70000.00 }
                  - { sectorId: campo, sectorNombre: Campo, entradasVendidas: 4, importeVendido: 32002.00 }
                comprasConEmisionIncompleta: { cantidad: 1, importe: 46001.00 }
        '401': { $ref: '#/components/responses/NoIdentificado' }
        '403': { $ref: '#/components/responses/SinAccesoAReportes' }
        '404': { $ref: '#/components/responses/EventoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /reportes/eventos/{eventoId}/devoluciones:
    get:
      tags: [Reportes]
      summary: Reporte de devoluciones de un evento (organizador titular o administrador)
      description: |
        Por sector y total: entradas vendidas históricas (compras CONFIRMADAS), entradas devueltas
        (entradas distintas con la baja completada), separadas por origen —`DEVOLUCION` (solicitud
        aprobada con la entrada devuelta) y `CANCELACION_EVENTO` (entradas de un reintegro por
        cancelación que salió bien)—, entradas netas (vendidas − devueltas) y el importe histórico
        de las devueltas. Las devoluciones en curso (pendientes, o aprobadas sin la entrada
        devuelta) se informan aparte y no restan.
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRolesReportes'
      responses:
        '200':
          description: Reporte de devoluciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteDevoluciones' }
              example:
                eventoId: evento-1
                eventoNombre: Recital de prueba
                estadoEvento: cancelado
                generadoEn: '2026-11-23T12:00:00Z'
                hayOperacionesPendientes: true
                totales:
                  entradasVendidas: 8
                  entradasDevueltas: 5
                  devueltasPorDevolucion: 1
                  devueltasPorCancelacion: 4
                  entradasNetas: 3
                  importeDevuelto: 61001.00
                  importeDevueltoPorDevolucion: 15000.00
                  importeDevueltoPorCancelacion: 46001.00
                sectores:
                  - sectorId: platea
                    sectorNombre: Platea
                    entradasVendidas: 4
                    entradasDevueltas: 3
                    devueltasPorDevolucion: 1
                    devueltasPorCancelacion: 2
                    entradasNetas: 1
                    importeDevuelto: 45000.00
                    importeDevueltoPorDevolucion: 15000.00
                    importeDevueltoPorCancelacion: 30000.00
                  - sectorId: campo
                    sectorNombre: Campo
                    entradasVendidas: 4
                    entradasDevueltas: 2
                    devueltasPorDevolucion: 0
                    devueltasPorCancelacion: 2
                    entradasNetas: 2
                    importeDevuelto: 16001.00
                    importeDevueltoPorDevolucion: 0.00
                    importeDevueltoPorCancelacion: 16001.00
                devolucionesEnCurso: { cantidad: 1, importe: 8000.50 }
        '401': { $ref: '#/components/responses/NoIdentificado' }
        '403': { $ref: '#/components/responses/SinAccesoAReportes' }
        '404': { $ref: '#/components/responses/EventoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /reportes/eventos/{eventoId}/recaudacion:
    get:
      tags: [Reportes]
      summary: Reporte de recaudación de un evento (organizador titular o administrador)
      description: |
        Por sector y total: recaudación bruta (precios históricos de las entradas de compras
        CONFIRMADAS), reintegros EXITOSOS de esas compras y recaudación neta (bruta − reintegros
        exitosos). El reintegro de una devolución se atribuye al sector de la entrada devuelta; el
        de una cancelación, al sector de cada entrada incluida según su precio. Aparte:
        `pendientesDeReconciliacion` (reintegros PENDIENTES o FALLIDOS de compras confirmadas, que
        no se descuentan) y `comprasNoConfirmadas` (lo cobrado en compras pendientes o fallidas y lo
        ya reintegrado de ellas, que no forma parte de la bruta ni de la neta).
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRolesReportes'
      responses:
        '200':
          description: Reporte de recaudación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteRecaudacion' }
              example:
                eventoId: evento-1
                eventoNombre: Recital de prueba
                estadoEvento: publicado
                generadoEn: '2026-11-23T12:00:00Z'
                hayOperacionesPendientes: true
                totales: { recaudacionBruta: 92002.00, reintegrosExitosos: 15000.00, recaudacionNeta: 77002.00 }
                sectores:
                  - { sectorId: platea, sectorNombre: Platea, recaudacionBruta: 60000.00, reintegrosExitosos: 15000.00, recaudacionNeta: 45000.00 }
                  - { sectorId: campo, sectorNombre: Campo, recaudacionBruta: 32002.00, reintegrosExitosos: 0.00, recaudacionNeta: 32002.00 }
                pendientesDeReconciliacion:
                  reintegrosPendientes: { cantidad: 1, importe: 8000.50 }
                  reintegrosFallidos: { cantidad: 0, importe: 0.00 }
                comprasNoConfirmadas: { compras: 1, cobrado: 46001.00, reintegrado: 46001.00 }
        '401': { $ref: '#/components/responses/NoIdentificado' }
        '403': { $ref: '#/components/responses/SinAccesoAReportes' }
        '404': { $ref: '#/components/responses/EventoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /reportes/eventos/{eventoId}/ocupacion:
    get:
      tags: [Reportes]
      summary: Reporte de ocupación de un evento (organizador titular o administrador)
      description: |
        Inventario actual según Disponibilidad y reservas (`GET /disponibilidad/eventos/{eventoId}`):
        por sector, capacidad, lugares vendidos y reservas temporales (lugares retenidos hasta su
        liberación), y la ocupación comercial = vendidos / capacidad × 100, con 2 decimales
        (capacidad 0 → 0.00); el total usa la suma de vendidos sobre la suma de capacidades. Las
        reservas temporales no suman a la ocupación. En un evento cancelado muestra el estado del
        inventario, no las entradas habilitadas. Si el evento no tiene inventario,
        `inventarioInicializado` es falso y los totales quedan en 0. Si Disponibilidad y reservas no
        responde, 503 sin datos parciales.
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRolesReportes'
      responses:
        '200':
          description: Reporte de ocupación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteOcupacion' }
              example:
                eventoId: evento-1
                eventoNombre: Recital de prueba
                estadoEvento: publicado
                generadoEn: '2026-11-23T12:00:00Z'
                hayOperacionesPendientes: false
                inventarioInicializado: true
                totales: { capacidad: 400, vendidos: 100, reservasTemporales: 5, porcentajeOcupacion: 25.00 }
                sectores:
                  - { sectorId: platea, sectorNombre: Platea, capacidad: 100, vendidos: 40, reservasTemporales: 5, porcentajeOcupacion: 40.00 }
                  - { sectorId: campo, sectorNombre: Campo, capacidad: 300, vendidos: 60, reservasTemporales: 0, porcentajeOcupacion: 20.00 }
        '401': { $ref: '#/components/responses/NoIdentificado' }
        '403': { $ref: '#/components/responses/SinAccesoAReportes' }
        '404': { $ref: '#/components/responses/EventoNoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Usuarios en `POST /auth/login`. Lo valida el API Gateway, no este servicio
    TokenDeServicio:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Token compartido entre servicios (variable SERVICIO_TOKEN; provisorio hasta JWT)
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: ID del usuario, el `sub` del JWT que valida el Gateway
      schema: { type: string }
      example: cliente-1
    XUserRoles:
      name: X-User-Roles
      in: header
      required: false
      description: Roles del usuario separados por coma, propagados por el Gateway desde el JWT. Sin distinguir mayúsculas ni espacios
      schema: { type: string }
      example: CLIENTE,PERSONAL_ACCESO
    XUserRole:
      name: X-User-Role
      in: header
      required: false
      deprecated: true
      description: Obsoleto. Rol único de la Entrega 1; solo se usa si no llega `X-User-Roles`, durante la transición
      schema: { type: string }
      example: CLIENTE
    CompraId:
      name: compraId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 3f2a9c1e-8b7d-4e6f-a1b2-c3d4e5f60718
    DevolucionId:
      name: devolucionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 8a1f2b3c-4d5e-4f60-9a1b-2c3d4e5f6071
    XUserRolesAdmin:
      name: X-User-Roles
      in: header
      required: false
      description: Roles del usuario separados por coma; debe incluir el rol de administrador (ADMIN por defecto), aunque tenga otros. Sin él, 403 SOLO_ADMINISTRADOR
      schema: { type: string }
      example: CLIENTE,ADMIN
    XUserRolesReportes:
      name: X-User-Roles
      in: header
      required: false
      description: |
        Roles del usuario separados por coma; debe incluir ORGANIZADOR (configurable en
        `compras.rol-organizador`) o el de administrador. Sin ninguno, 403 SIN_PERMISO_REPORTES. Un
        organizador solo ve los eventos cuyo `organizadorId` (según Eventos) es su `X-User-Id`.
      schema: { type: string }
      example: ORGANIZADOR
    EventoId:
      name: eventoId
      in: path
      required: true
      schema: { type: string }
      example: evento-1

  schemas:
    IniciarCompraPedido:
      type: object
      required: [reservaId]
      properties:
        reservaId: { type: string, description: ID de una reserva propia y vigente }
    PagoPedido:
      type: object
      required: [medioDePago]
      properties:
        medioDePago:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, BANK_TRANSFER, DIGITAL_WALLET]
    Compra:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADA, FALLIDA] }
        reservaId: { type: string }
        evento:
          type: object
          properties:
            id: { type: string }
            nombre: { type: string }
            fechaInicio: { type: string, format: date-time }
        lugares:
          type: array
          description: Una fila por entrada
          items: { $ref: '#/components/schemas/Lugar' }
        total:
          type: number
          description: En pesos, con 2 decimales como máximo
        medioDePago:
          type: string
          nullable: true
          description: Vacío hasta que se pide el cobro
        fecha: { type: string, format: date-time }
        reintegros:
          type: array
          description: Reintegros pedidos sobre la compra (devoluciones de entradas o venta rechazada)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              monto: { type: number }
              origen: { type: string, enum: [DEVOLUCION, CANCELACION_EVENTO, VENTA_RECHAZADA] }
              estado: { type: string, enum: [PENDIENTE, EXITOSO, FALLIDO] }
    SolicitarDevolucionPedido:
      type: object
      required: [entradaId]
      properties:
        entradaId: { type: string, description: ID de una entrada vigente propia }
    RechazarDevolucionPedido:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, maxLength: 255 }
    Devolucion:
      type: object
      description: El estado de la solicitud y el de su reintegro son independientes.
      properties:
        id: { type: string, format: uuid, description: devolucionId }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        entradaId: { type: string }
        compraId: { type: string, format: uuid }
        evento:
          type: object
          properties:
            id: { type: string }
            nombre: { type: string }
            fechaInicio: { type: string, format: date-time }
        lugar:
          type: object
          properties:
            sectorId: { type: string }
            sectorNombre: { type: string }
            fila: { type: integer, nullable: true, description: Solo en sectores numerados }
            numero: { type: integer, nullable: true }
        monto: { type: number, description: Precio unitario pagado por la entrada }
        motivoRechazo: { type: string, description: Solo si fue rechazada }
        creadaEn: { type: string, format: date-time }
        resueltaEn: { type: string, format: date-time, nullable: true }
        coordinacion:
          type: object
          description: Solo si fue aprobada
          properties:
            completa: { type: boolean }
            pasoPendiente:
              type: string
              nullable: true
              enum: [ENTRADA_EN_REINTEGRO, LIBERAR_LUGAR, REINTEGRO, ENTRADA_DEVUELTA]
            ultimoError: { type: string, nullable: true }
        reintegro:
          type: object
          description: Solo si fue aprobada
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [PENDIENTE, EXITOSO, FALLIDO] }
            intentos: { type: integer }
    Reintegro:
      type: object
      properties:
        id: { type: string, format: uuid }
        compraId: { type: string, format: uuid }
        refundRequestId:
          type: string
          format: uuid
          description: En una devolución es el devolucionId; en los demás orígenes lo genera este servicio
        monto: { type: number, description: En un evento cancelado, el precio de las entradas que seguían vigentes }
        motivo: { type: string, description: 'Se envía a Pagos como reason (obligatorio). En un evento cancelado: "Evento cancelado"' }
        origen:
          type: string
          enum: [DEVOLUCION, CANCELACION_EVENTO, VENTA_RECHAZADA]
          description: CANCELACION_EVENTO es el reintegro automático de una compra confirmada, o pendiente ya cobrada, de un evento cancelado (incluida la compra cobrada cuya emisión Entradas rechazó con EVENTO_CERRADO)
        estado: { type: string, enum: [PENDIENTE, EXITOSO, FALLIDO] }
        intentos: { type: integer }
        pagosReintegroId: { type: string, nullable: true, description: ID del reintegro en Pagos }
        ultimoError: { type: string, nullable: true }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    CancelacionEventoPedido:
      type: object
      required: [eventoId]
      properties:
        eventoId: { type: string }
        motivo: { type: string, description: Motivo de la cancelación en Eventos (informativo) }
        canceladoEn: { type: string, format: date-time }
    ModificacionEventoPedido:
      type: object
      required: [eventoId, version]
      description: Debe venir al menos uno de fechaHora, lugar o ciudad
      properties:
        eventoId: { type: string }
        version: { type: integer, minimum: 1, description: Contador de modificaciones del evento en Eventos }
        fechaHora: { type: string, format: date-time, description: Nueva fecha y hora de inicio, ISO-8601 en UTC }
        lugar: { type: string, description: Nuevo lugar }
        ciudad: { type: string, description: Nueva ciudad }
    AvisoModificacion:
      type: object
      properties:
        eventoId: { type: string }
        version: { type: integer }
        resultado: { type: string, enum: [ACEPTADA, YA_PROCESADA, VERSION_ANTERIOR] }
    CoCompras:
      type: object
      required: [eventoId, coCompras]
      properties:
        eventoId: { type: string, description: Evento consultado }
        coCompras:
          type: array
          items:
            type: object
            required: [eventoId, cantidad]
            properties:
              eventoId: { type: string, description: Otro evento comprado }
              cantidad: { type: integer, description: Clientes distintos que compraron los dos eventos }
    HistorialPreferencias:
      type: object
      required: [usuarioId, tipos, eventosComprados]
      properties:
        usuarioId: { type: string }
        tipos:
          type: array
          items:
            type: object
            required: [tipo, cantidad]
            properties:
              tipo: { type: string, description: Tipo de evento tal como lo informa Eventos }
              cantidad: { type: integer, description: Compras confirmadas de ese tipo }
        eventosComprados:
          type: array
          maxItems: 20
          description: eventoId distintos de las compras confirmadas, del más reciente al más antiguo
          items: { type: string }
    AvisoCancelacion:
      type: object
      properties:
        eventoId: { type: string }
        resultado: { type: string, enum: [ACEPTADO, YA_PROCESADO] }
    Lugar:
      type: object
      properties:
        sectorId: { type: string }
        sectorNombre: { type: string }
        fila: { type: integer, nullable: true, description: Solo en sectores numerados }
        numero: { type: integer, nullable: true, description: Solo en sectores numerados }
        precioUnitario: { type: number, description: Precio al momento de la compra }
        entradaId: { type: string, nullable: true, description: Vacío hasta que se emite la entrada }
    OperacionEnCurso:
      type: object
      properties:
        compraId: { type: string, format: uuid }
        estado: { type: string, enum: [EN_CURSO] }
        mensaje: { type: string }
    EncabezadoReporte:
      type: object
      required: [eventoId, eventoNombre, estadoEvento, generadoEn, hayOperacionesPendientes]
      properties:
        eventoId: { type: string }
        eventoNombre: { type: string }
        estadoEvento: { type: string, description: Estado según Eventos (borrador, publicado, agotado, cancelado, finalizado) }
        generadoEn: { type: string, format: date-time }
        hayOperacionesPendientes:
          type: boolean
          description: |
            Verdadero si el evento tiene compras PENDIENTES que ya tienen pago (cobradas sin
            confirmar), devoluciones en curso o reintegros PENDIENTES o FALLIDOS. Una compra
            PENDIENTE sin pago no cuenta.
    CantidadImporte:
      type: object
      properties:
        cantidad: { type: integer, format: int64 }
        importe: { type: number }
    ReporteVentas:
      allOf:
        - $ref: '#/components/schemas/EncabezadoReporte'
        - type: object
          properties:
            totales:
              type: object
              properties:
                comprasConfirmadas: { type: integer, format: int64 }
                entradasVendidas: { type: integer, format: int64 }
                importeVendido: { type: number }
            sectores:
              type: array
              items:
                type: object
                properties:
                  sectorId: { type: string }
                  sectorNombre: { type: string, nullable: true }
                  entradasVendidas: { type: integer, format: int64 }
                  importeVendido: { type: number }
            comprasConEmisionIncompleta:
              allOf: [{ $ref: '#/components/schemas/CantidadImporte' }]
              description: Compras PENDIENTES ya cobradas cuya emisión no terminó (no son ventas)
    CantidadesDeDevolucion:
      type: object
      properties:
        entradasVendidas: { type: integer, format: int64 }
        entradasDevueltas: { type: integer, format: int64, description: Suma de los dos orígenes (no se solapan) }
        devueltasPorDevolucion: { type: integer, format: int64 }
        devueltasPorCancelacion: { type: integer, format: int64 }
        entradasNetas: { type: integer, format: int64 }
        importeDevuelto: { type: number }
        importeDevueltoPorDevolucion: { type: number }
        importeDevueltoPorCancelacion: { type: number }
    ReporteDevoluciones:
      allOf:
        - $ref: '#/components/schemas/EncabezadoReporte'
        - type: object
          properties:
            totales: { $ref: '#/components/schemas/CantidadesDeDevolucion' }
            sectores:
              type: array
              items:
                allOf:
                  - type: object
                    properties:
                      sectorId: { type: string }
                      sectorNombre: { type: string, nullable: true }
                  - $ref: '#/components/schemas/CantidadesDeDevolucion'
            devolucionesEnCurso:
              allOf: [{ $ref: '#/components/schemas/CantidadImporte' }]
              description: Solicitudes pendientes o aprobadas sin la entrada devuelta (no restan)
    MontosDeRecaudacion:
      type: object
      properties:
        recaudacionBruta: { type: number }
        reintegrosExitosos: { type: number }
        recaudacionNeta: { type: number }
    ReporteRecaudacion:
      allOf:
        - $ref: '#/components/schemas/EncabezadoReporte'
        - type: object
          properties:
            totales: { $ref: '#/components/schemas/MontosDeRecaudacion' }
            sectores:
              type: array
              items:
                allOf:
                  - type: object
                    properties:
                      sectorId: { type: string }
                      sectorNombre: { type: string, nullable: true }
                  - $ref: '#/components/schemas/MontosDeRecaudacion'
            pendientesDeReconciliacion:
              type: object
              description: Reintegros de compras confirmadas que todavía no salieron bien (no se descuentan)
              properties:
                reintegrosPendientes: { $ref: '#/components/schemas/CantidadImporte' }
                reintegrosFallidos: { $ref: '#/components/schemas/CantidadImporte' }
            comprasNoConfirmadas:
              type: object
              description: Compras cobradas que no llegaron a confirmarse (pendientes o fallidas)
              properties:
                compras: { type: integer, format: int64 }
                cobrado: { type: number }
                reintegrado: { type: number, description: Reintegros EXITOSOS de esas compras }
    Ocupacion:
      type: object
      properties:
        capacidad: { type: integer }
        vendidos: { type: integer }
        reservasTemporales: { type: integer }
        porcentajeOcupacion: { type: number, description: vendidos / capacidad × 100, con 2 decimales }
    ReporteOcupacion:
      allOf:
        - $ref: '#/components/schemas/EncabezadoReporte'
        - type: object
          properties:
            inventarioInicializado: { type: boolean, description: Falso si Disponibilidad y reservas no tiene inventario del evento }
            totales: { $ref: '#/components/schemas/Ocupacion' }
            sectores:
              type: array
              items:
                allOf:
                  - type: object
                    properties:
                      sectorId: { type: string }
                      sectorNombre: { type: string, nullable: true, description: Nombre según Eventos }
                  - $ref: '#/components/schemas/Ocupacion'
    Error:
      type: object
      required: [timestamp, status, error, mensaje]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: Código del error }
        mensaje: { type: string }
        campos:
          type: object
          additionalProperties: { type: string }
          description: Solo en errores de validación

  responses:
    ServicioNoAutorizado:
      description: Falta el encabezado `X-Service-Token`, su valor no coincide o el servicio no tiene token configurado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-20T12:00:00Z'
            status: 403
            error: SERVICIO_NO_AUTORIZADO
            mensaje: Solo los servicios autorizados pueden llamar a este endpoint
    SoloAdministrador:
      description: La operación es solo para administradores
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 403
            error: SOLO_ADMINISTRADOR
            mensaje: Esta operación solo la puede hacer un administrador
    DevolucionNoEncontrada:
      description: La solicitud no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 404
            error: DEVOLUCION_NO_ENCONTRADA
            mensaje: No existe la devolución 8a1f2b3c-4d5e-4f60-9a1b-2c3d4e5f6071
    DevolucionYaResuelta:
      description: La solicitud ya fue aprobada o rechazada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 409
            error: DEVOLUCION_YA_RESUELTA
            mensaje: La devolución 8a1f2b3c-4d5e-4f60-9a1b-2c3d4e5f6071 ya fue aprobada o rechazada
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 400
            error: VALIDACION
            mensaje: El pedido tiene datos inválidos
            campos:
              reservaId: es obligatorio
    ParametroInvalido:
      description: El ID no es un UUID
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 400
            error: PARAMETRO_INVALIDO
            mensaje: El parámetro compraId no tiene un formato válido
    NoIdentificado:
      description: Falta `X-User-Id` (llamada que no pasó por el Gateway) o, por el Gateway, falta el token o es inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            sinUsuario:
              summary: Llamada directa sin X-User-Id
              value:
                timestamp: '2026-11-08T18:00:00Z'
                status: 401
                error: USUARIO_NO_IDENTIFICADO
                mensaje: Falta el encabezado X-User-Id
            sinToken:
              summary: Por el Gateway, sin Authorization
              value:
                timestamp: '2026-11-08T18:00:00Z'
                status: 401
                error: NO_AUTENTICADO
                mensaje: Se requiere un token JWT válido
            tokenInvalido:
              summary: Por el Gateway, token vencido o inválido
              value:
                timestamp: '2026-11-08T18:00:00Z'
                status: 401
                error: TOKEN_INVALIDO
                mensaje: El token es inválido, está vencido o no fue emitido por TicketYa
    AccesoDenegado:
      description: La compra es de otro cliente o, por el Gateway, el rol no está autorizado para la operación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            compraAjena:
              summary: La compra es de otro cliente
              value:
                timestamp: '2026-11-08T18:00:00Z'
                status: 403
                error: ACCESO_DENEGADO
                mensaje: La compra 3f2a9c1e-8b7d-4e6f-a1b2-c3d4e5f60718 pertenece a otro cliente
            rolNoAutorizado:
              summary: Por el Gateway, el rol no alcanza
              value:
                timestamp: '2026-11-08T18:00:00Z'
                status: 403
                error: ACCESO_DENEGADO
                mensaje: El rol no está autorizado para esta operación
    CompraNoEncontrada:
      description: La compra no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 404
            error: COMPRA_NO_ENCONTRADA
            mensaje: No existe la compra 3f2a9c1e-8b7d-4e6f-a1b2-c3d4e5f60718
    ServicioNoDisponible:
      description: Otro servicio no respondió
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-08T18:00:00Z'
            status: 503
            error: SERVICIO_NO_DISPONIBLE
            mensaje: El servicio de Pagos no está disponible. Intente de nuevo más tarde
    SinAccesoAReportes:
      description: Sin rol de organizador ni administrador, o el organizador no es el titular del evento
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            sinRol:
              summary: El usuario no es organizador ni administrador (no se consulta a Eventos)
              value:
                timestamp: '2026-11-23T12:00:00Z'
                status: 403
                error: SIN_PERMISO_REPORTES
                mensaje: Los reportes los consulta el organizador del evento o un administrador
            eventoAjeno:
              summary: El evento es de otro organizador
              value:
                timestamp: '2026-11-23T12:00:00Z'
                status: 403
                error: EVENTO_AJENO
                mensaje: El evento pertenece a otro organizador
    EventoNoEncontrado:
      description: Eventos no conoce el evento
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-11-23T12:00:00Z'
            status: 404
            error: EVENTO_NO_ENCONTRADO
            mensaje: No existe el evento evento-9

