spring.application.name=compras
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/ticketya_compras?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Sin open-in-view: cada transacción lee la base, sin reutilizar entidades cargadas antes en el
# mismo pedido. El pago depende de esto para ver el estado real de la compra tras el bloqueo.
spring.jpa.open-in-view=false

# Servicios externos (llamadas directas entre servicios, sin pasar por el Gateway)
servicios.reservas.url=${RESERVAS_URL:http://localhost:8080}
servicios.eventos.url=${EVENTOS_URL:http://localhost:8081}
servicios.pagos.url=${PAGOS_URL:http://localhost:8084}
servicios.entradas.url=${ENTRADAS_URL:http://localhost:8085}
# Rutas de Pagos (internas). Cada una conserva su única variable ({purchaseId}, {paymentId} o {refundId})
servicios.pagos.rutas.cobro=/internal/pagos
servicios.pagos.rutas.pagos-por-compra=/internal/pagos/compra/{purchaseId}
servicios.pagos.rutas.reintegro=/internal/pagos/{paymentId}/reintegros
servicios.pagos.rutas.reintento-reintegro=/internal/reintegros/{refundId}/reintentar
servicios.pagos.rutas.consulta-reintegro=/internal/reintegros/{refundId}
servicios.timeout-conexion=2s
servicios.timeout-lectura=5s

# Pago
compras.emision.intentos=3
compras.emision.espera-entre-intentos=200ms
# Si el servicio se cae a mitad de un pago, la clave queda en proceso; pasado este plazo se puede retomar
compras.idempotencia.plazo-en-proceso=60s

# Cancelación de eventos: una cancelación en proceso más allá de este plazo (el servicio se cayó
# o una compra falló) se retoma automáticamente, sin esperar otro aviso de Eventos
compras.cancelacion.plazo-en-proceso=5m
# Cada cuánto se revisan las cancelaciones en proceso vencidas, y si la revisión está activa
compras.cancelacion.intervalo-reanudacion=60s
compras.cancelacion.reanudacion-activa=true

# Valor de X-User-Role del administrador (confirmado por el grupo). Se compara sin distinguir mayúsculas
compras.rol-administrador=ADMIN
